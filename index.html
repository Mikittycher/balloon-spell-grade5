
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Balloon Spell Grade 5</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="game-container">

    <h1>🎈 Balloon Spell</h1>
    <p class="level">英検5級</p>

    <div class="status-bar">
      <p>Score：<span id="score">0</span></p>
      <p>Lives：<span id="lives">❤️❤️❤️</span></p>
    </div>

    <section class="question-card">
      <p class="label">意味</p>
      <h2 id="meaning">りんご</h2>

      <button id="speak-button" type="button">
        🔊 発音を聞く
      </button>

      <input
        id="answer-input"
        type="text"
        placeholder="英単語を入力"
        autocomplete="off"
        autocapitalize="none"
        spellcheck="false"
      >

      <button id="answer-button" type="button">
        答える
      </button>

      <p id="message"></p>
    </section>

  </main>

  <script src="script.js?v=6"></script>
</body>
</html>
